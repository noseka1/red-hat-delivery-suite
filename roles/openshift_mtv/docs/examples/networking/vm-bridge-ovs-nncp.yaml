apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: vm-bridge
spec:
  desiredState:
    interfaces:
    - name: ens7
      type: ethernet
      ipv4:
        enabled: false
      ipv6:
        enabled: false
      # Enable LLDP to receive information on which switch and switch port
      # is this network interace connected to.
      lldp:
        enabled: true
      state: up
    - name: ens8
      type: ethernet
      ipv4:
        enabled: false
      ipv6:
        enabled: false
      lldp:
        enabled: true
      state: up
    - name: bond1
      type: bond
      link-aggregation:
        mode: active-backup
        options:
          miimon: '100'
        port:
        - ens7
        - ens8
      state: up
    - name: vm-bridge
      type: ovs-bridge
      bridge:
        port:
        - name: bond1
        # Allow OVN-Kubernetes to dynamically add its own patch ports to the bridge for internal connectivity,
        # without NMState treating them as unexpected configuration and removing them.
        allow-extra-patch-ports: true
        options:
          stp: false
      state: up
    ovn:
      bridge-mappings:
      - bridge: vm-bridge
        localnet: localnet-vm-bridge
        state: present
