apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aap-admin-password-custom
  namespace: aap
spec:
  secretStoreRef:
    name: autogitops
    kind: ClusterSecretStore
  dataFrom:
  - extract:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
      key: '{{ oscommon_cluster_domain }}/aap/instance/aap-admin-password'
