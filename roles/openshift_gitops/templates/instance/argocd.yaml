apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: {{ gitops_instance_name }}
  namespace: {{ gitops_instance_namespace }}
spec:
  applicationSet:
    resources:
      limits:
        cpu: "2"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    sourceNamespaces:
      - '*'
    webhookServer:
      ingress:
        enabled: false
      route:
        enabled: false
  controller:
    processors: {}
    resources:
      limits:
        cpu: "4"
        memory: 16Gi
      requests:
        cpu: 250m
        memory: 1Gi
    sharding: {}
  grafana:
    enabled: false
  ha:
    enabled: {{ gitops_instance_high_availability }}
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  imageUpdater:
    enabled: false
  initialSSHKnownHosts: {}
  monitoring:
    enabled: true
    disableMetrics: false
  notifications:
    enabled: true
    sourceNamespaces:
      - '*'
  prometheus:
    enabled: false
  rbac:
    defaultPolicy: 'role:readonly'
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admin, role:admin
    scopes: '[groups]'
  redis:
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  repo:
    replicas: 1
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi
    volumeMounts:
    - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
      subPath: ca-bundle.crt
      name: trusted-ca-bundle
    volumes:
      - configMap:
          name: trusted-ca-bundle
        name: trusted-ca-bundle
        optional: true
  resourceExclusions: |
    - apiGroups:
      - ""
      - discovery.k8s.io
      clusters:
      - '*'
      kinds:
      - Endpoints
      - EndpointSlice
    - apiGroups:
      - apiregistration.k8s.io
      clusters:
      - '*'
      kinds:
      - APIService
    - apiGroups:
      - coordination.k8s.io
      clusters:
      - '*'
      kinds:
      - Lease
    - apiGroups:
      - authentication.k8s.io
      - authorization.k8s.io
      clusters:
      - '*'
      kinds:
      - SelfSubjectReview
      - TokenReview
      - LocalSubjectAccessReview
      - SelfSubjectAccessReview
      - SelfSubjectRulesReview
      - SubjectAccessReview
    - apiGroups:
      - certificates.k8s.io
      clusters:
      - '*'
      kinds:
      - CertificateSigningRequest
    - apiGroups:
      - cert-manager.io
      clusters:
      - '*'
      kinds:
      - CertificateRequest
    - apiGroups:
      - cilium.io
      clusters:
      - '*'
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      - CiliumEndpointSlice
    - apiGroups:
      - kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      clusters:
      - '*'
      kinds:
      - PolicyReport
      - ClusterPolicyReport
      - EphemeralReport
      - ClusterEphemeralReport
      - AdmissionReport
      - ClusterAdmissionReport
      - BackgroundScanReport
      - ClusterBackgroundScanReport
      - UpdateRequest
    - apiGroups:
      - tekton.dev
      clusters:
      - '*'
      kinds:
      - TaskRun
      - PipelineRun
  server:
    autoscale:
      enabled: false
    grpc:
      ingress:
        enabled: false
    ingress:
      enabled: false
    replicas: 1
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 125m
        memory: 128Mi
    route:
      enabled: true
    service:
      type: ""
  sso:
    dex:
      openShiftOAuth: true
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 250m
          memory: 128Mi
    provider: dex
  sourceNamespaces:
    - '*'
  tls:
    ca: {}
  # Enable Helm templating in Kustomize
  kustomizeBuildOptions: --enable-helm
  extraConfig:
    # The default label-based tracking fails due to the label value must be no more than 63 characters long.
    # Switch to resource tracking using annotations.
    # See also https://argo-cd.readthedocs.io/en/stable/user-guide/resource_tracking/
    application.resourceTrackingMethod: annotation
    # Prevent out-of-sync when using aggregated cluster roles. See also:
    # https://github.com/argoproj/argo-cd/issues/2382
    resource.compareoptions: |
      ignoreAggregatedRoles: true
    # See also Known Kubernetes types in CRDs (Resource limits, Volume mounts etc)
    # https://argo-cd.readthedocs.io/en/stable/user-guide/diffing/#known-kubernetes-types-in-crds-resource-limits-volume-mounts-etc
    # This makes the sonarqube-postgresql StatefulSet sync
    resource.customizations.knownTypeFields.apps_StatefulSet: |
      - field: spec.volumeClaimTemplates
        type: core/v1/PersistentVolumeClaimTemplate
    # This makes KubeVirt VirtualMachine objects sync
    resource.customizations.ignoreDifferences.kubevirt.io_VirtualMachine: |
      jqPathExpressions:
        - .spec.template.spec.domain.devices.interfaces[].macAddress
        - .spec.runStrategy
    # This makes Contour CRD objects sync
    # https://argo-cd.readthedocs.io/en/stable/operator-manual/upgrading/2.14-3.0/#removing-default-ignores-of-preserveunknownfields-for-crd
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
        jsonPointers:
        - /spec/preserveUnknownFields
    # Extend the expiration period of the user authentication token generated by Argo CD. Default is 24 hours.
    users.session.duration: '31d'
    # By default, all connections made by the API server to OIDC providers must pass certificate validation.
    # See also https://argo-cd.readthedocs.io/en/stable/operator-manual/user-management/#skipping-certificate-verification-on-oidc-provider-connections
    oidc.tls.insecure.skip.verify: '{{ gitops_instance_oidc_tls_insecure_skip_verify }}'
    # Fix reconciliation of Route object in openshift_hashicorp_vault role
    # See also https://github.com/argoproj/argo-cd/issues/17358
    controller.diff.server.side: "true"
  resourceExclusions: |
    # Argo CD should ignore Backup and Restore objects managed by Velero
    # See also https://velero.io/docs/v1.14/backup-reference/
    - apiGroups:
      - velero.io
      kinds:
      - Backup
      - Restore
      clusters:
      - "*"
    # The Argo CD resource tracking annotation is propagated from Namespace to the Project object. Argo CD should ignore
    # the Project managed by OpenShift. We prefer using Kubernetes-native Namespaces and no Projects. Argo CD must ignore
    # the Project to delete a Namespace successfully. Note that this was not needed for label-based resource tracking.
    - apiGroups:
      - project.openshift.io
      kinds:
      - Project
      clusters:
      - "*"
  resourceHealthChecks:
{% for item in gitops_instance_health_check_files.files %}
    - group: {{ item.path | dirname | dirname | basename }}
      kind: {{ item.path | dirname | basename }}
      check: |
        {{ lookup('file', item.path, rstrip=false) | indent(8) }}
{% endfor %}
# As of GitOps operator version 1.19.0, this nodePlacement is ignored
{% if gitops_place_on_infra_nodes %}
  nodePlacement:
    nodeSelector:
      node-role.kubernetes.io/infra: ""
    tolerations:
    - key: node-role.kubernetes.io/infra
      effect: NoSchedule
      operator: Exists
{% endif %}
