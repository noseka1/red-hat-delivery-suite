- ansible.builtin.import_role:
    name: openshift_common
    tasks_from: install_plan_approve
  vars:
    oscomm_subscription_name: odf-operator
    oscomm_subscription_namespace: openshift-storage

- ansible.builtin.import_role:
    name: openshift_autogitops
    tasks_from: app_deploy.yml
  vars:
    autogitops_app_src_path: templates/operator
    autogitops_app_dst_path: odf/operator
    autogitops_app_namespace: openshift-storage

- ansible.builtin.import_role:
    name: openshift_common
    tasks_from: wait_for_operator.yml
  vars:
    oscomm_subscription_name: odf-operator
    oscomm_subscription_namespace: openshift-storage

- ansible.builtin.import_role:
    name: openshift_common
    tasks_from: console_plugin_enable.yml
  vars:
    oscomm_enable_console_plugin:
      - odf-console

- name: Wait for storageclusters.ocs.openshift.io CRD to be established
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: storageclusters.ocs.openshift.io
  register: odf_storagecluster_crd_result
  until:
    - odf_storagecluster_crd_result.resources.0.status.conditions | default([])
      | selectattr('type', 'equalto', 'Established')
      | selectattr('status', 'equalto', 'True')
      | list | length > 0
  retries: 24
  delay: 5
