- ansible.builtin.import_role:
    name: openshift_common
    tasks_from: get_infrastructure.yml

- ansible.builtin.assert:
    that:
      - odf_platform_to_storageclass[oscommon_infrastructure.status.platformStatus.type].mon_pvc_template is defined
      - odf_platform_to_storageclass[oscommon_infrastructure.status.platformStatus.type].mon_pvc_template | length > 0
      - odf_platform_to_storageclass[oscommon_infrastructure.status.platformStatus.type].storage_device_sets is defined
      - odf_platform_to_storageclass[oscommon_infrastructure.status.platformStatus.type].storage_device_sets | length > 0
    fail_msg: Cannot determine which storageclass to use for the underlying persistent volumes.
    quiet: true

- name: Check if default storage class exists
  ansible.builtin.import_role:
    name: openshift_common
    tasks_from: get_default_storage_class.yml

- name: Check if default volume snapshot class exists
  ansible.builtin.import_role:
    name: openshift_common
    tasks_from: get_default_volume_snapshot_class.yml

- name: Check if storageclass ocs-storagecluster-ceph-rbd-virtualization exists
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: ocs-storagecluster-ceph-rbd-virtualization
  register: odf_storageclass_rbd_virtualization_result

- ansible.builtin.import_role:
    name: openshift_autogitops
    tasks_from: app_deploy.yml
  vars:
    autogitops_app_src_path: templates/instance/internal
    autogitops_app_dst_path: odf/instance/internal
    autogitops_app_namespace: openshift-storage
    autogitops_app_sync_retries: 600
