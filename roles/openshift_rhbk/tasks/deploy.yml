- ansible.builtin.import_role:
    name: openshift_common
    tasks_from: install_plan_approve
  vars:
    oscomm_subscription_name: rhbk-operator
    oscomm_subscription_namespace: keycloak

- ansible.builtin.import_role:
    name: openshift_autogitops
    tasks_from: app_deploy.yml
  vars:
    autogitops_app_src_path: templates/operator
    autogitops_app_dst_path: rhbk/operator
    autogitops_app_namespace: keycloak

- ansible.builtin.import_tasks: get_instance_hostname.yml

- ansible.builtin.import_role:
    name: openshift_postgresql
    tasks_from: deploy.yml
  vars:
    postgresql_namespace: keycloak
    postgresql_manage_namespace: false
    postgresql_app_prefix: keycloak-
    postgresql_database_name: keycloak

- ansible.builtin.import_role:
    name: openshift_autogitops
    tasks_from: app_deploy.yml
  vars:
    autogitops_app_src_path: templates/instance
    autogitops_app_dst_path: rhbk/instance
    autogitops_app_namespace: keycloak

- ansible.builtin.import_tasks: get_connection.yml

- ansible.builtin.import_tasks: set_admin_password.yml

- ansible.builtin.import_tasks: report_success.yml
