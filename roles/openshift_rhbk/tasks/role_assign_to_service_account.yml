- name: Obtain list of clients
  ansible.builtin.uri:
    url: https://{{ rhbk_hostname }}/admin/realms/{{ rhbk_realm_name }}/clients
    headers:
      Authorization: Bearer {{ rhbk_access_token }}
    validate_certs: true
    status_code: [ 200 ]
  register: rhbk_clients_list_result

- ansible.builtin.set_fact:
    rhbk_client_id: >-
      {{ (rhbk_clients_list_result.json | selectattr('clientId', 'equalto', rhbk_client_name) | first).id }}

- name: Retrieve service account user for client {{ rhbk_client_name }}
  ansible.builtin.uri:
    url: https://{{ rhbk_hostname }}/admin/realms/{{ rhbk_realm_name }}/clients/{{ rhbk_client_id }}/service-account-user
    headers:
      Authorization: Bearer {{ rhbk_access_token }}
    validate_certs: true
    status_code: [ 200 ]
  register: rhbk_service_account_user_result

- name: Look up role {{ rhbk_role_name }}
  ansible.builtin.uri:
    url: https://{{ rhbk_hostname }}/admin/realms/{{ rhbk_realm_name }}/roles/{{ rhbk_role_name }}
    headers:
      Authorization: Bearer {{ rhbk_access_token }}
    validate_certs: true
    status_code: [ 200 ]
  register: rhbk_role_get_result

- name: Assign role {{ rhbk_role_name }} to service account user {{ rhbk_service_account_user_result.json.id }}
  ansible.builtin.uri:
    url: https://{{ rhbk_hostname }}/admin/realms/{{ rhbk_realm_name }}/users/{{ rhbk_service_account_user_result.json.id }}/role-mappings/realm
    method: POST
    headers:
      Authorization: Bearer {{ rhbk_access_token }}
    body_format: json
    body:
      - id: '{{ rhbk_role_get_result.json.id }}'
        name: '{{ rhbk_role_get_result.json.name }}'
        description: '{{ rhbk_role_get_result.json.description }}'
    validate_certs: true
    status_code: [ 204 ]
