- ansible.builtin.import_role:
    name: openshift_autogitops
    tasks_from: app_deploy.yml
  vars:
    autogitops_app_src_path: templates/goldilocks
    autogitops_app_dst_path: goldilocks
    autogitops_app_namespace: '{{ goldilocks_namespace }}'

- ansible.builtin.import_role:
    name: openshift_oauth_proxy
    tasks_from: deploy.yml
  vars:
    oauthproxy_name: '{{ goldilocks_name }}'
    oauthproxy_namespace: '{{ goldilocks_namespace }}'
    oauthproxy_upstream: http://{{ goldilocks_name }}-dashboard
    oauthproxy_app_prefix: goldilocks-

- ansible.builtin.import_tasks: report_success.yml
