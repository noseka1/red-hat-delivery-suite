apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ oauthproxy_name }}-oauth-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ oauthproxy_name }}-oauth-proxy
subjects:
- kind: ServiceAccount
  name: {{ oauthproxy_name }}-oauth-proxy
  namespace: {{ oauthproxy_namespace }}
