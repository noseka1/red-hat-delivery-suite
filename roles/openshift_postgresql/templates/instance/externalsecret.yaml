apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ postgresql_app_prefix }}postgresql-creds
  namespace: {{ postgresql_namespace }}
spec:
  secretStoreRef:
    name: autogitops
    kind: ClusterSecretStore
  dataFrom:
  - extract:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
      key: '{{ oscommon_cluster_domain }}/{{ postgresql_app_prefix }}postgresql/instance/credentials'
