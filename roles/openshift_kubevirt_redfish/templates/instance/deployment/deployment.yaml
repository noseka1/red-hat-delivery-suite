apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubevirt-redfish
  namespace: kubevirt-redfish
  labels:
    app.kubernetes.io/name: kubevirt-redfish
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubevirt-redfish
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubevirt-redfish
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: kubevirt-redfish
      securityContext:
        runAsNonRoot: true
      containers:
      - name: kubevirt-redfish
        image: registry.redhat.io/container-native-virtualization/kubevirt-redfish-rhel9:v4.22
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8443
          protocol: TCP
        env:
        - name: CONFIG_PATH
          value: /app/config/config.yaml
        - name: LOG_LEVEL
          value: info
        resources:
          requests:
            memory: 512Mi
            cpu: 100m
          limits:
            memory: 2Gi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /redfish/v1/
            port: 8443
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /redfish/v1/
            port: 8443
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: config-volume
        secret:
          secretName: kubevirt-redfish
